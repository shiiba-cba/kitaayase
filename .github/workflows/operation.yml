name: Update operation info

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分間隔
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # package.json がある場合
      - name: Install dependencies
        run: npm ci
        if: hashFiles('package.json') != ''

      - name: Fetch operation info
        run: node src/tools/updateOperationInfo.js
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}

      - name: Commit if changed
        run: |
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/operation.json
            git commit -m "Update Chiyoda line operation info"
            git push
          else
            echo "No changes to commit"
          fi
