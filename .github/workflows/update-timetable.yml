name: Detect diagram revision and update timetable

on:
  schedule:
    # JST 4:30 = UTC 19:30
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      force_diagram_date:
        description: 'Yahoo番線データを強制再取得する日付 (YYYYMMDD)。空白の場合は latest.json を参照。'
        required: false
        default: ''

jobs:
  update-timetable:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # --------------------------------------------------
      # Fetch raw TrainTimetable (加工前)
      # --------------------------------------------------
      - name: Fetch raw timetable
        run: |
          node src/tools/fetchRawTrainTimetable.js
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}

      # --------------------------------------------------
      # Compare raw data (previous vs current)
      # --------------------------------------------------
      - name: Compare raw timetable
        id: diff
        run: |
          RAW_DIR="public/data/raw"
          PREV="$RAW_DIR/previous.json"
          CURR="$RAW_DIR/current.json"

          if [ ! -f "$PREV" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if diff -q "$PREV" "$CURR" > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # Generate processed timetable if changed
      # --------------------------------------------------
      - name: Generate timetable (diagram revision detected)
        if: steps.diff.outputs.changed == 'true'
        run: |
          DIAGRAM_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          node src/tools/generateTimetable.js "$DIAGRAM_DATE"

      # --------------------------------------------------
      # Generate processed train master if changed
      # --------------------------------------------------
      - name: Generate train master (diagram revision detected)
        if: steps.diff.outputs.changed == 'true'
        run: |
          DIAGRAM_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          node src/tools/generateTrainMaster.js "$DIAGRAM_DATE"

      # --------------------------------------------------
      # Update latest.json
      # --------------------------------------------------
      - name: Update latest.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          DIAGRAM_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "{ \"diagramDate\": \"$DIAGRAM_DATE\" }" > public/data/latest.json

      # --------------------------------------------------
      # Update raw baseline
      # --------------------------------------------------
      - name: Update raw baseline
        run: |
          cp public/data/raw/current.json public/data/raw/previous.json

      # --------------------------------------------------
      # Commit & push (only if diagram changed)
      # --------------------------------------------------
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data
          git commit -m "Add new timetable data for diagram revision"
          git push

      # --------------------------------------------------
      # Read latest diagram date
      # --------------------------------------------------
      - name: Read latest diagram date
        id: latest
        run: |
          if [ -n "${{ github.event.inputs.force_diagram_date }}" ]; then
            DIAGRAM_DATE="${{ github.event.inputs.force_diagram_date }}"
          else
            DIAGRAM_DATE=$(node -e "console.log(require('./public/data/latest.json').diagramDate)")
          fi
          echo "date=$DIAGRAM_DATE" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # Collect Yahoo platform data (ayase -> kitaayase)
      # --------------------------------------------------
      - name: Collect yahoo-platform-ayase-kitaayase
        id: yahoo_aka
        run: |
          DIR="public/data/${{ steps.latest.outputs.date }}/yahoo-platform-ayase-kitaayase"
          if [ -n "${{ github.event.inputs.force_diagram_date }}" ] && [ -d "$DIR" ]; then
            rm -rf "$DIR"
          fi
          if [ ! -d "$DIR" ]; then
            node src/tools/yahoo-platform-ayase-kitaayase.js --diagram-date "${{ steps.latest.outputs.date }}"
            echo "ran=true" >> $GITHUB_OUTPUT
          else
            echo "ran=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # Collect Yahoo platform data (ayase -> kitasenju)
      # --------------------------------------------------
      - name: Collect yahoo-platform-ayase-kitasenju
        id: yahoo_aks
        run: |
          DIR="public/data/${{ steps.latest.outputs.date }}/yahoo-platform-ayase-kitasenju"
          if [ -n "${{ github.event.inputs.force_diagram_date }}" ] && [ -d "$DIR" ]; then
            rm -rf "$DIR"
          fi
          if [ ! -d "$DIR" ]; then
            node src/tools/yahoo-platform-ayase-kitasenju.js --diagram-date "${{ steps.latest.outputs.date }}"
            echo "ran=true" >> $GITHUB_OUTPUT
          else
            echo "ran=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # Collect Yahoo platform data (kitasenju -> ayase)
      # --------------------------------------------------
      - name: Collect yahoo-platform-kitasenju-ayase
        id: yahoo_ksa
        run: |
          DIR="public/data/${{ steps.latest.outputs.date }}/yahoo-platform-kitasenju-ayase"
          if [ -n "${{ github.event.inputs.force_diagram_date }}" ] && [ -d "$DIR" ]; then
            rm -rf "$DIR"
          fi
          if [ ! -d "$DIR" ]; then
            node src/tools/yahoo-platform-kitasenju-ayase.js --diagram-date "${{ steps.latest.outputs.date }}"
            echo "ran=true" >> $GITHUB_OUTPUT
          else
            echo "ran=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # Commit & push yahoo platform data (if any ran)
      # --------------------------------------------------
      - name: Commit and push yahoo platform data
        if: steps.yahoo_aka.outputs.ran == 'true' || steps.yahoo_aks.outputs.ran == 'true' || steps.yahoo_ksa.outputs.ran == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data
          git commit -m "Add yahoo platform data for ${{ steps.latest.outputs.date }}"
          git push
